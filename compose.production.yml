services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: sqlite:////app/data/signal.db
      DEMO_MODE: "true"
      DEMO_OTP: ${DEMO_OTP:-123456}
      SESSION_COOKIE_SECURE: "true"
      STATIC_DIRECTORY: /app/static
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
