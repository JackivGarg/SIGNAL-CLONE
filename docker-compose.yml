services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:///./data/signal.db
      DEMO_MODE: "true"
      DEMO_OTP: "123456"
      SESSION_COOKIE_SECURE: "false"

volumes:
  backend_data:
  frontend_node_modules:
