[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-clone-backend"
version = "0.1.0"
description = "FastAPI service for the Signal Clone assignment"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.19,<2",
  "argon2-cffi>=25,<26",
  "fastapi>=0.141,<0.142",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
